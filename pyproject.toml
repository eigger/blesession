[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blesession"
version = "0.1.0"
description = "One BLE session, instrumented: connect, notifications, stage timings, where it failed and why — for Home Assistant BLE integrations."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "eigger" }]
keywords = ["ble", "bluetooth", "bleak", "home-assistant", "session", "diagnostics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: System :: Hardware",
    "Operating System :: OS Independent",
]
# The core is bleak-only. The Home Assistant adapter (blesession.hass) imports
# homeassistant lazily; it is not a dependency here because it is only ever
# imported from inside a running Home Assistant.
dependencies = [
    "bleak>=0.22",
    "bleak-retry-connector>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "build>=1.2",
    "mypy>=1.14",
]

[project.urls]
Homepage = "https://github.com/eigger/blesession"
Repository = "https://github.com/eigger/blesession"
Changelog = "https://github.com/eigger/blesession/blob/main/CHANGELOG.md"
Documentation = "https://github.com/eigger/blesession/blob/main/docs/design.md"
Issues = "https://github.com/eigger/blesession/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Code blocks in the docs are aligned for reading, not for the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blesession = ["py.typed"]

[tool.mypy]
files = ["src/blesession"]
python_version = "3.13"
strict = true
# bleak-retry-connector ships no py.typed
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Only hass.py imports it, lazily; not a dependency and not type-checked here.
module = ["homeassistant.*"]
follow_imports = "skip"
