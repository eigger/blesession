name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=blesession --cov-report=term-missing --cov-fail-under=85

  # Install the *lowest* version each floor in pyproject.toml allows, so a
  # floor that is too low fails here instead of in a downstream install.
  test-min-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
      - run: |
          uv venv
          uv pip install --resolution lowest-direct -e ".[dev]"
          uv pip list
      - run: uv run --no-sync pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, test-min-deps]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: py.typed and licence are in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          missing = [n for n in ("blesession/py.typed",) if n not in names]
          if missing or not any("/licenses/LICENSE" in n for n in names):
              print("MISSING:", missing); sys.exit(1)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
